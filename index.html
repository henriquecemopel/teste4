<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Chamados</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .chat-card { width: 100%; max-width: 500px; height: 600px; background: #1e1e1e; border-radius: 12px; display: flex; flex-direction: column; border: 1px solid #333; }
        .header { padding: 15px; background: #252525; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .select-unit { padding: 8px; background: #333; color: #fff; border: 1px solid #444; border-radius: 6px; }
        .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 75%; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
        .msg-u1 { background: #1b3a4b; align-self: flex-start; border-left: 3px solid #00b4d8; }
        .msg-u2 { background: #2d3a1e; align-self: flex-end; border-right: 3px solid #52b788; }
        .msg-header { font-size: 0.75rem; color: #aaa; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
        .input-area { padding: 15px; background: #252525; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 10px; background: #333; border: 1px solid #444; border-radius: 6px; color: #fff; outline: none; }
        input:disabled, button:disabled { opacity: 0.6; cursor: not-allowed; }
        button { padding: 10px 18px; background: #0077b6; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover:not(:disabled) { background: #0096c7; }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="header">
        <h3>Troca de Mensagens</h3>
        <select id="unitSelect" class="select-unit" onchange="trocarUnidade()">
            <option value="Unidade 1">Unidade 1</option>
            <option value="Unidade 2">Unidade 2</option>
        </select>
    </div>

    <div class="messages-box" id="messagesBox">
        <!-- As mensagens vindas do Google Script serão desenhadas aqui -->
    </div>

    <div class="input-area">
        <input type="text" id="msgText" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') enviarMensagem()">
        <button id="btnEnviar" onclick="enviarMensagem()">Enviar</button>
    </div>
</div>

<script>
    // URL atualizada do seu Web App no Apps Script
    const ENDPOINT_API = "https://script.google.com/macros/s/AKfycbxvG_AZGXqTkcpouGbR3bgyQ1tuem8WRaNtvO_KBZtuQtMEwbs0E4DRwT9qrDReZLNU/exec";
    
    let carregando = false;

    // 1. LER AS MENSAGENS
    async function carregarMensagens() {
        if (carregando) return;
        carregando = true;

        try {
            const resposta = await fetch(ENDPOINT_API);
            const dadosJson = await resposta.json();
            
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';

            dadosJson.forEach(item => {
                const div = document.createElement('div');
                div.className = `msg ${item.unidade === 'Unidade 1' ? 'msg-u1' : 'msg-u2'}`;
                
                // Cabeçalho da mensagem (Unidade e Horário)
                const msgHeader = document.createElement('div');
                msgHeader.className = 'msg-header';
                
                const strongUnidade = document.createElement('strong');
                strongUnidade.textContent = item.unidade || 'Sem Unidade';
                
                const spanHorario = document.createElement('span');
                spanHorario.textContent = item.horario || '';
                
                msgHeader.appendChild(strongUnidade);
                msgHeader.appendChild(spanHorario);

                // Texto da mensagem (protegido contra XSS usando textContent)
                const msgTexto = document.createElement('div');
                msgTexto.textContent = item.texto || '';

                div.appendChild(msgHeader);
                div.appendChild(msgTexto);
                box.appendChild(div);
            });

            box.scrollTop = box.scrollHeight;
        } catch (erro) {
            console.error("Erro ao carregar mensagens:", erro);
        } finally {
            carregando = false;
        }
    }

    // 2. ENVIAR A NOVA MENSAGEM
    async function enviarMensagem() {
        const input = document.getElementById('msgText');
        const btn = document.getElementById('btnEnviar');
        const unidade = document.getElementById('unitSelect').value;
        const texto = input.value.trim();

        if (!texto) return;

        const novaMensagem = {
            unidade: unidade,
            texto: texto,
            horario: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        // Bloqueia os elementos enquanto envia
        input.disabled = true;
        btn.disabled = true;

        try {
            // 'mode: no-cors' e 'text/plain' garantem o envio correto para o Apps Script
            await fetch(ENDPOINT_API, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(novaMensagem)
            });

            input.value = '';
            
            // Aguarda 600ms para o servidor salvar antes de buscar novamente
            setTimeout(carregarMensagens, 600);
        } catch (erro) {
            console.error("Erro ao enviar mensagem:", erro);
        } finally {
            input.disabled = false;
            btn.disabled = false;
            input.focus();
        }
    }

    function trocarUnidade() {
        carregarMensagens();
    }

    // Atualiza as mensagens a cada 3.5 segundos
    setInterval(carregarMensagens, 3500);
    carregarMensagens();
</script>

</body>
</html>
