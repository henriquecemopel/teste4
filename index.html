<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Chamados</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .chat-card { width: 100%; max-width: 500px; height: 600px; background: #1e1e1e; border-radius: 12px; display: flex; flex-direction: column; border: 1px solid #333; }
        .header { padding: 15px; background: #252525; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .select-unit { padding: 8px; background: #333; color: #fff; border: 1px solid #444; border-radius: 6px; }
        .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 75%; font-size: 0.9rem; line-height: 1.4; }
        .msg-u1 { background: #1b3a4b; align-self: flex-start; border-left: 3px solid #00b4d8; }
        .msg-u2 { background: #2d3a1e; align-self: flex-end; border-right: 3px solid #52b788; }
        .msg-header { font-size: 0.75rem; color: #aaa; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .input-area { padding: 15px; background: #252525; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 10px; background: #333; border: 1px solid #444; border-radius: 6px; color: #fff; outline: none; }
        button { padding: 10px 18px; background: #0077b6; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0096c7; }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="header">
        <h3>Troca de Mensagens</h3>
        <select id="unitSelect" class="select-unit" onchange="trocarUnidade()">
            <option value="Unidade 1">Unidade 1</option>
            <option value="Unidade 2">Unidade 2</option>
        </select>
    </div>

    <div class="messages-box" id="messagesBox">
        <!-- As mensagens vindas do arquivo .json serão desenhadas aqui -->
    </div>

    <div class="input-area">
        <input type="text" id="msgText" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter') enviarMensagem()">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>
</div>

<script>
    // URL do servidor/API que realmente grava no arquivo mensagens.json
    const ENDPOINT_API = "http://localhost:3000/mensagens";

    // 1. LER AS MENSAGENS DO ARQUIVO SEPARADO (JSON)
    async function carregarMensagens() {
        try {
            const resposta = await fetch(ENDPOINT_API);
            const dadosJson = await resposta.json();
            
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';

            // Desenha na tela só o que está gravado no arquivo JSON
            dadosJson.forEach(item => {
                const div = document.createElement('div');
                div.className = `msg ${item.unidade === 'Unidade 1' ? 'msg-u1' : 'msg-u2'}`;
                div.innerHTML = `
                    <div class="msg-header">
                        <strong>${item.unidade}</strong>
                        <span>${item.horario}</span>
                    </div>
                    <div>${item.texto}</div>
                `;
                box.appendChild(div);
            });

            box.scrollTop = box.scrollHeight;
        } catch (erro) {
            console.error("Aguardando servidor de salvamento ou arquivo JSON...", erro);
        }
    }

    // 2. ENVIAR A NOVA MENSAGEM PARA GRAVAR NO ARQUIVO SEPARADO (JSON)
    async function enviarMensagem() {
        const input = document.getElementById('msgText');
        const unidade = document.getElementById('unitSelect').value;
        const texto = input.value.trim();

        if (!texto) return;

        const novaMensagem = {
            unidade: unidade,
            texto: texto,
            horario: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        // Envia o dado via POST para o arquivo JSON separado
        await fetch(ENDPOINT_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(novaMensagem)
        });

        input.value = '';
        carregarMensagens(); // Atualiza a tela após salvar no JSON
    }

    function trocarUnidade() {
        carregarMensagens();
    }

    // Recarrega as mensagens a cada 2 segundos para ver novas mensagens enviadas
    setInterval(carregarMensagens, 2000);
    carregarMensagens();
</script>

</body>
</html>
